kind = "web"
previewPath = "/"
title = "ALEMONA Botanical Showroom"
description = "A cinematic, touch-friendly digital product showroom for ALEMONA Natural Hair & Scalp Care, focused on botanical formulas, ingredients, textures, and usage rather than commerce."
version = "1.0.0"
id = "artifacts/alemona-showroom"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18602

[services.development]
run = "pnpm --filter @workspace/alemona-showroom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alemona-showroom", "run", "build" ]
serve = "static"
publicDir = "artifacts/alemona-showroom/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18602"
BASE_PATH = "/"
